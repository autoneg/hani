[project]
name = "hani"
version = "0.3.2"
description = "Run Human-Agent Negotiations"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Anonymous" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=44.0.2",
    "hvplot>=0.11.2",
    "litellm>=1.0.0",
    "negmas>=0.15.5",
    "negmas-llm>=0.4.3",
    "panel>=1.6.1",
    "plotly>=6.0.0",

    "rich>=13.0.0",
    "sqlalchemy>=2.0.39",
    "typer>=0.9.0",
]

[build-system]
# requires = ["hatchling"]
# build-backend = "hatchling.build"
requires = ["setuptools >= 40.6.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hani = [
    "images/*.JPG",
    "images/*.jpg",
    "images/*.png",
    "templates/*.html",
    "sample_scenarios/**/*.yml",
    "sample_scenarios/**/*.yaml",
    "default_settings/*.md",
    "default_settings/*.txt",
    "default_settings/*.json",
    "config/*.yaml",
    "config/*.yml",
    "static/*.css",
    "static/*.js",
    "announcements.md",
]

[tool.setuptools.exclude-package-data]
hani = [
    "*.local",
    "*.backup",
    "*_old.*",
    "*.working_backup",
    ".DS_Store",
]

[project.scripts]
hani = "hani.run:app"
hani-guest = "hani.runguest:app"
hani-reg = "hani.runregister:app"
hani-app = "hani.runapp:app"
hani-analysis = "hani.runanalytics:app"
hani-experiment = "hani.runexperiment:app"


[project.optional-dependencies]
dev = [
    "bumpversion>=0.6.0",
    "watchfiles>=1.0.4",
]
doc = [
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-include-markdown-plugin>=7.1.4",
    "mkdocs-material>=9.6.5",
    "mkdocs>=1.6.1",
    "mkdocstrings-python>=1.16.1",
]
docs = [
    "mkdocs-jupyter>=0.25.1",
]

[tool.bumpversion]  # bumpversion config
current_version = "0.2.0"
delete_bookmark = true
commit = false
tag = false

[tool.pytest.ini_options]  # pytest config
# addopts = "--doctest-modules"  # Example: If you use doctest
# testpaths = ["tests"]         # Example: If you have a tests directory
collect_ignore = ['setup.py']

[tool.mypy]
warn_unused_configs = false
warn_incomplete_stub = true
check_untyped_defs = true
python_version = "3.11"
strict_optional = false
ignore_missing_imports = false

[[tool.mypy.overrides]]  # mypy overrides
module = ["setup.*"]
check_untyped_defs = false

[tool.flake8]
exclude = ["docs"]

[dependency-groups]
dev = [
    "alembic>=1.15.1",
    "playwright>=1.57.0",
    "pytest>=9.0.2",
    "pytest-playwright>=0.7.2",
    "sqlalchemy-schemadisplay>=2.0",
    "twine>=6.1.0",
]
