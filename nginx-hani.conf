# nginx reverse-proxy snippet for the HANI interfaces on
# anac.cs.brown.edu.
#
# How to use:
#   1. Copy this file to the server, e.g. /etc/nginx/snippets/hani.conf
#   2. Inside the existing `server { ... }` block for anac.cs.brown.edu
#      (the one that already serves /api/, /home, /leaderboard, …) add:
#
#          include /etc/nginx/snippets/hani.conf;
#
#   3. Reload nginx:
#
#          sudo nginx -t && sudo systemctl reload nginx
#
#   4. Start the HANI processes under your user account:
#
#          cd ~/hani
#          # background the two long-running services (use tmux / systemd / nohup
#          # — pick whichever fits your ops):
#          ./run.sh           # serves /hanapp on  127.0.0.1:5006 (auth required)
#          ./runguest.sh      # serves /hanguest on 127.0.0.1:5008 (public)
#
# Bokeh / panel must keep the websocket open. The `proxy_http_version`
# + `Upgrade`/`Connection` headers do that. The `proxy_set_header
# Host …` is what panel checks against `--allow-websocket-origin`.

# ---------------------------------------------------------------------------
# Authenticated HANI app — participants who already have credentials.
# ---------------------------------------------------------------------------
location /hanapp {
    proxy_pass http://127.0.0.1:5006;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout  86400s;
    proxy_send_timeout  86400s;
}

# ---------------------------------------------------------------------------
# Public HANI guest playground — no authentication, anyone can negotiate.
# ---------------------------------------------------------------------------
location /hanguest {
    proxy_pass http://127.0.0.1:5008;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout  86400s;
    proxy_send_timeout  86400s;
}
