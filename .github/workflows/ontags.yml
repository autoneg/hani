name: CI (On-Tags)
on:
  push:
    tags:
      - "*"
jobs:
  tests:
    name: "Python ${{ matrix.python-version }}"
    runs-on: "ubuntu-latest"
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: "actions/checkout@v6"
      - name: "Install uv"
        uses: "astral-sh/setup-uv@v8"
        with:
          version: "latest"
      - name: "Set up Python ${{ matrix.python-version }}"
        run: uv python install ${{ matrix.python-version }}
      - name: "Install dependencies"
        run: |
          uv sync --dev
      - name: "Run unit tests for ${{ matrix.python-version }}"
        run: uv run pytest tests/test_event_tracking.py -v
  package:
    name: "Build & verify package"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v6"
      - name: "Install uv"
        uses: "astral-sh/setup-uv@v8"
        with:
          version: "latest"
      - name: "Set up Python"
        run: uv python install 3.13
      - name: "Build package"
        run: uv build
      - name: "List result"
        run: "ls -l dist"
      - name: "Check long_description"
        run: |
          uv run --with twine twine check dist/*
  install-dev:
    strategy:
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
    name: "Verify dev env"
    runs-on: "${{ matrix.os }}"
    steps:
      - uses: "actions/checkout@v6"
      - name: "Install uv"
        uses: "astral-sh/setup-uv@v8"
        with:
          version: "latest"
      - name: "Set up Python"
        run: uv python install 3.13
      - name: "Install in dev mode"
        run: |
          uv sync --dev
      - name: "Import package"
        run: uv run python -c "import hani; print('hani imported successfully')"
